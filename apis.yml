aid: aisera
name: Aisera
description: >-
  Aisera is an enterprise agentic AI platform that builds, deploys, and orchestrates
  AI agents and assistants for IT service management, HR, finance, procurement, and
  customer service. The AiseraGPT platform combines domain-specific LLMs, conversational
  AI, enterprise/neural search, knowledge generation, and AI workflow automation to
  autonomously resolve requests, deflect tickets, and serve knowledge across channels
  (Webchat, Slack, MS Teams, email, IVR, and more). For developers, Aisera exposes
  tenant-scoped REST APIs — Ingestion APIs for pushing knowledge and requests into the
  platform, a Data Source Ingestion Monitoring API, SCIM-style User Provisioning APIs,
  and a Conversation & Workflows API with WebSocket — plus Event Studio for event-driven
  workflows and a large library of data-source connectors. Aisera was acquired by
  Automation Anywhere.
