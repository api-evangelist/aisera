apis:
- name: Aisera Ingestion APIs
  description: >-
    Push data directly into the Aisera platform from any external system that supports
    webhooks — Knowledge Articles and Requests. Authenticates with an x-app-token header
    plus an OAuth 2.0 password-grant bearer token.
  humanURL: https://docs.aisera.com/apis/apis/ingestion-apis.md
  baseURL: https://tenant.api.aisera.cloud
  tags:
  - Ingestion
  - Knowledge
  - Webhook
  tags_raw:
  - Ingestion
  - Knowledge
  - Webhooks
  properties:
  - type: Documentation
    url: https://docs.aisera.com/apis/apis/ingestion-apis.md
  - type: Authentication
    url: authentication/aisera-authentication.yml
- name: Aisera Data Source Ingestion Monitoring API
  description: >-
    GET /dsexecution returns ingestion-pipeline job status (SUCCEEDED / PENDING / RUNNING
    / FAILED / KILLED) and run metrics for a tenant's data source. Uses HTTP Basic auth.
  humanURL: https://docs.aisera.com/apis/apis/data-source-ingestion-monitoring-api.md
  baseURL: https://tenant.api.aisera.cloud
  tags:
  - Monitoring
  - Ingestion
  properties:
  - type: Documentation
    url: https://docs.aisera.com/apis/apis/data-source-ingestion-monitoring-api.md
- name: Aisera User Provisioning APIs
  description: >-
    SCIM-style user lifecycle endpoints — /scim/provision-user, /scim/update-user and
    /scim/de-provision-user — for managing Aisera platform users. Basic or Bearer auth
    plus x-app-token.
  humanURL: https://docs.aisera.com/apis/apis/user-provisioning-apis.md
  baseURL: https://company.login.aisera.cloud
  tags:
  - User Provisioning
  - SCIM
  - Identity
  properties:
  - type: Documentation
    url: https://docs.aisera.com/apis/apis/user-provisioning-apis.md
  - type: Authentication
    url: authentication/aisera-authentication.yml
- name: Aisera Conversation & Workflows API and WebSocket
  description: >-
    Build custom conversational interfaces for AiseraGPT applications — decoration,
    NLP/NLU processing, slot filling, context management, and notifications — over REST
    and WebSocket.
  humanURL: https://docs.aisera.com/apis/apis/conversation-api-and-websocket.md
  baseURL: https://tenant.api.aisera.cloud
  tags:
  - Conversation
  - WebSocket
